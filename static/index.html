<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoPeças</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-soft: #1f2937;
      --text: #e2e8f0;
      --muted: #cbd5e1;
      --primary: #3b82f6;
      --accent: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
    }
    .app-shell {
      width: min(430px, 94vw);
      background: var(--panel);
      border-radius: 20px;
      padding: 26px 22px 30px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.45);
    }
    .app-shell:has(#vendas-screen.active) {
      width: min(1040px, 96vw);
    }
    .brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand h1 {
      margin: 0;
      font-size: 2.1rem;
    }
    .brand span {
      color: var(--muted);
      display: block;
      margin-top: 8px;
      font-size: 0.93rem;
    }
    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }
    .top-nav {
      display: flex;
      gap: 10px;
      margin: 0 0 18px;
      padding: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
    }
    .nav-button {
      flex: 1;
      margin-top: 0;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .nav-button.active {
      background: linear-gradient(135deg, var(--primary), #2563eb);
      color: white;
      border-color: rgba(255,255,255,0.12);
      box-shadow: 0 8px 18px rgba(59,130,246,0.28);
    }
    label {
      display: block;
      margin: 12px 0 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    input, button {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #334155;
      font-size: 1rem;
    }
    input {
      padding: 12px 14px;
      background: #f8fafc;
      color: #111827;
    }
    button {
      margin-top: 16px;
      padding: 12px 14px;
      background: var(--primary);
      border: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button.secondary {
      background: var(--warning);
      color: #111827;
    }
    .hidden {
      display: none;
    }
    .status {
      margin-top: 14px;
      min-height: 20px;
      font-size: 0.9rem;
      color: #fca5a5;
    }
    .panel {
      background: linear-gradient(180deg, rgba(31,41,55,0.96), rgba(17,24,39,0.96));
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      padding: 18px 16px;
      margin-top: 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .panel h2 {
      margin-top: 0;
      font-size: 1.1rem;
      color: #f8fafc;
    }
    .product-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .product-list li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 10px;
      border: 1px solid rgba(148, 163, 184, 0.08);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.22);
      margin-top: 8px;
    }
    .product-list li:last-child {
      border-bottom: none;
    }
    .admin-section {
      margin-top: 18px;
    }
    .inline-grid {
      display: grid;
      gap: 8px;
    }
    .status {
      border-radius: 8px;
      padding: 4px 0;
    }
    .sale-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
      gap: 16px;
      align-items: start;
    }
    .product-list button {
      width: auto;
      min-width: 108px;
      flex: 0 0 auto;
      margin: 0;
      padding: 8px 10px;
    }
    .product-list li > span {
      min-width: 0;
      flex: 1 1 auto;
      overflow-wrap: anywhere;
    }
    .cart-row {
      align-items: center;
      flex-wrap: nowrap;
    }
    .cart-row input {
      width: 72px;
      flex: 0 0 72px;
      padding: 8px;
    }
    .cart-row strong {
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .cart-row button {
      width: auto;
      flex: 0 0 auto;
      margin: 0;
      padding: 7px 10px;
      background: #b91c1c;
    }
    .customer-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .customer-form button {
      width: auto;
      margin: 0;
      white-space: nowrap;
    }
    @media (max-width: 760px) {
      .sale-layout, .customer-form {
        grid-template-columns: 1fr;
      }
      .product-list li {
        flex-wrap: wrap;
      }
      .cart-row {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="login-screen" class="screen active">
      <div class="brand">
        <h1>AutoPeças</h1>
        <span>Login do vendedor</span>
      </div>
      <label for="username">Usuário</label>
      <input id="username" type="text" placeholder="Digite seu usuário" />

      <label for="password">Senha</label>
      <input id="password" type="password" placeholder="Digite sua senha" />

      <button id="login-button">Entrar</button>
      <div id="login-status" class="status"></div>
    </section>

    <section id="vendas-screen" class="screen">
      <div class="brand">
        <h1>AutoPeças</h1>
        <span>Consulta de estoque</span>
      </div>

      <nav id="app-nav" class="top-nav hidden">
        <button id="nav-vendas" class="nav-button active" type="button">Vendas</button>
        <button id="nav-produtos" class="nav-button hidden" type="button">Produtos</button>
        <button id="nav-financeiro" class="nav-button" type="button">Financeiro</button>
      </nav>

      <div class="sale-layout">
        <div class="panel">
          <h2>Escolher produtos</h2>
          <input id="product-search" type="search" placeholder="Buscar por nome, marca ou categoria" />
          <button id="search-button">Buscar</button>
          <ul id="products-list" class="product-list">
            <li><span>Use a pesquisa para carregar produtos.</span></li>
          </ul>
        </div>

        <div>
          <div class="panel">
            <h2>Cliente</h2>
            <label for="sale-customer">Vincular cliente</label>
            <select id="sale-customer">
              <option value="">Consumidor final</option>
            </select>
            <details>
              <summary>Cadastrar novo cliente</summary>
              <div class="customer-form">
                <div>
                  <label for="customer-name">Nome</label>
                  <input id="customer-name" type="text" placeholder="Nome da pessoa" />
                </div>
                <div>
                  <label for="customer-phone">Telefone</label>
                  <input id="customer-phone" type="tel" placeholder="(00) 00000-0000" />
                </div>
                <button id="create-customer-button" type="button">Salvar cliente</button>
              </div>
              <div id="customer-status" class="status"></div>
            </details>
          </div>

          <div class="panel">
            <h2>Carrinho</h2>
            <ul id="cart-list" class="product-list"></ul>
            <div id="cart-total"><strong>Total: R$ 0,00</strong></div>
            <button id="sale-button" type="button">Finalizar venda</button>
            <div id="sale-status" class="status"></div>
          </div>
        </div>
      </div>

      <button id="logout-button" class="secondary">Sair</button>
    </section>

    <section id="produtos-screen" class="screen">
      <div class="brand">
        <h1>AutoPeças</h1>
        <span>Produtos</span>
      </div>

      <nav id="app-nav-products" class="top-nav hidden">
        <button id="nav-vendas-products" class="nav-button" type="button">Vendas</button>
        <button id="nav-produtos-products" class="nav-button active" type="button">Produtos</button>
        <button id="nav-financeiro-products" class="nav-button" type="button">Financeiro</button>
      </nav>

      <div id="admin-product-panel" class="panel admin-section hidden">
        <h2>Cadastrar produto</h2>
        <div class="inline-grid">
          <label for="product-name">Nome</label>
          <input id="product-name" type="text" placeholder="Ex: Pastilha Bosch" />

          <label for="product-brand">Marca</label>
          <input id="product-brand" type="text" placeholder="Ex: Bosch" />

          <label for="product-factory-number">Número de fábrica</label>
          <input id="product-factory-number" type="text" placeholder="Ex: 12345" />

          <label for="product-category">Categoria</label>
          <input id="product-category" type="text" placeholder="Ex: Freio" />

          <label for="product-quantity">Quantidade</label>
          <input id="product-quantity" type="number" min="0" value="0" />

          <label for="product-cost-price">Preço de custo</label>
          <input id="product-cost-price" type="number" min="0" step="0.01" value="0" />

          <label for="product-price">Preço de venda</label>
          <input id="product-price" type="number" min="0" step="0.01" value="0" />
        </div>
        <button id="create-product-button">Cadastrar produto</button>
        <div id="product-status" class="status"></div>
      </div>

      <button id="logout-button-products" class="secondary">Sair</button>
    </section>

    <section id="financeiro-screen" class="screen">
      <div class="brand">
        <h1>AutoPeças</h1>
        <span>Financeiro</span>
      </div>

      <nav id="app-nav-finance" class="top-nav hidden">
        <button id="nav-vendas-alt" class="nav-button" type="button">Vendas</button>
        <button id="nav-produtos-finance" class="nav-button hidden" type="button">Produtos</button>
        <button id="nav-financeiro-alt" class="nav-button active" type="button">Financeiro</button>
      </nav>

      <div class="panel">
        <h2>Relatório de vendas</h2>
        <label for="finance-start">Data inicial</label>
        <input id="finance-start" type="date" />
        <label for="finance-end">Data final</label>
        <input id="finance-end" type="date" />
        <button id="finance-button">Consultar</button>
        <div id="finance-summary" class="status"></div>
        <ul id="finance-list" class="product-list"></ul>
      </div>

      <button id="logout-button-finance" class="secondary">Sair</button>
    </section>
  </main>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const vendasScreen = document.getElementById('vendas-screen');
    const produtosScreen = document.getElementById('produtos-screen');
    const financeiroScreen = document.getElementById('financeiro-screen');
    const appNav = document.getElementById('app-nav');
    const appNavProducts = document.getElementById('app-nav-products');
    const appNavFinance = document.getElementById('app-nav-finance');
    const navVendas = document.getElementById('nav-vendas');
    const navProdutos = document.getElementById('nav-produtos');
    const navFinanceiro = document.getElementById('nav-financeiro');
    const navVendasAlt = document.getElementById('nav-vendas-alt');
    const navProdutosProducts = document.getElementById('nav-produtos-products');
    const navFinanceiroProducts = document.getElementById('nav-financeiro-products');
    const navVendasProducts = document.getElementById('nav-vendas-products');
    const navProdutosFinance = document.getElementById('nav-produtos-finance');
    const navFinanceiroAlt = document.getElementById('nav-financeiro-alt');
    const loginStatus = document.getElementById('login-status');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const productSearch = document.getElementById('product-search');
    const productsList = document.getElementById('products-list');
    const cartList = document.getElementById('cart-list');
    const cartTotal = document.getElementById('cart-total');
    const saleCustomer = document.getElementById('sale-customer');
    const customerNameInput = document.getElementById('customer-name');
    const customerPhoneInput = document.getElementById('customer-phone');
    const customerStatus = document.getElementById('customer-status');
    const saleStatus = document.getElementById('sale-status');
    const productStatus = document.getElementById('product-status');
    const adminProductPanel = document.getElementById('admin-product-panel');
    const productNameInput = document.getElementById('product-name');
    const productBrandInput = document.getElementById('product-brand');
    const productFactoryNumberInput = document.getElementById('product-factory-number');
    const productCategoryInput = document.getElementById('product-category');
    const productQuantityInput = document.getElementById('product-quantity');
    const productCostPriceInput = document.getElementById('product-cost-price');
    const productPriceInput = document.getElementById('product-price');
    const financeSummary = document.getElementById('finance-summary');
    const financeList = document.getElementById('finance-list');
    const financeStart = document.getElementById('finance-start');
    const financeEnd = document.getElementById('finance-end');

    const tokenKey = 'autopecas-token';
    const cart = new Map();
    let currentUser = null;
    let currentView = 'vendas';

    function setStatus(el, message, isError = false) {
      el.textContent = message;
      el.style.color = isError ? '#fca5a5' : '#86efac';
    }

    function setScreen(screen) {
      currentView = screen;
      loginScreen.classList.toggle('active', screen === 'login');
      vendasScreen.classList.toggle('active', screen === 'vendas');
      produtosScreen.classList.toggle('active', screen === 'produtos');
      financeiroScreen.classList.toggle('active', screen === 'financeiro');
      navVendas.classList.toggle('active', screen === 'vendas');
      navProdutos.classList.toggle('active', screen === 'produtos');
      navFinanceiro.classList.toggle('active', screen === 'financeiro');
      navVendasAlt.classList.toggle('active', screen === 'vendas');
      navProdutosProducts.classList.toggle('active', screen === 'produtos');
      navFinanceiroProducts.classList.toggle('active', screen === 'financeiro');
      navVendasProducts.classList.toggle('active', screen === 'vendas');
      navProdutosFinance.classList.toggle('active', screen === 'produtos');
      navFinanceiroAlt.classList.toggle('active', screen === 'financeiro');
    }

    function updateNavigation() {
      const isAdmin = currentUser && currentUser.role === 'admin';
      appNav.classList.toggle('hidden', !currentUser);
      appNavProducts.classList.toggle('hidden', !currentUser);
      appNavFinance.classList.toggle('hidden', !currentUser);
      navProdutos.classList.toggle('hidden', !isAdmin);
      navProdutosFinance.classList.toggle('hidden', !isAdmin);
      navProdutosProducts.classList.toggle('hidden', !isAdmin);
      navFinanceiro.disabled = !isAdmin;
      navProdutos.disabled = !isAdmin;
      navFinanceiroAlt.disabled = !isAdmin;
      navProdutosFinance.disabled = !isAdmin;
      navProdutosProducts.disabled = !isAdmin;
      navFinanceiro.classList.toggle('hidden', !isAdmin);
      navFinanceiroAlt.classList.toggle('hidden', !isAdmin);
      adminProductPanel.classList.toggle('hidden', !isAdmin);
      if (!isAdmin && ['financeiro', 'produtos'].includes(currentView)) {
        setScreen('vendas');
      }
    }

    function getToken() {
      return localStorage.getItem(tokenKey);
    }

    function saveToken(token) {
      localStorage.setItem(tokenKey, token);
    }

    function clearToken() {
      localStorage.removeItem(tokenKey);
      currentUser = null;
      updateNavigation();
    }

    async function apiFetch(url, options = {}) {
      const token = getToken();
      const headers = { ...(options.headers || {}) };
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const response = await fetch(url, { ...options, headers });
      if (!response.ok) {
        const detail = await response.text();
        throw new Error(detail || 'Erro na requisição');
      }
      const contentType = response.headers.get('content-type') || '';
      if (contentType.includes('application/json')) {
        return response.json();
      }
      return response.text();
    }

    async function login() {
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      if (!username || !password) {
        setStatus(loginStatus, 'Informe usuário e senha.', true);
        return;
      }

      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || 'Credenciais inválidas');
        }

        saveToken(payload.access_token);
        currentUser = await apiFetch('/auth/me');
        updateNavigation();
        setStatus(loginStatus, '');
        usernameInput.value = '';
        passwordInput.value = '';
        setScreen('vendas');
        productsList.innerHTML = '<li><span>Use a pesquisa para carregar produtos.</span></li>';
        loadCustomers();
      } catch (error) {
        setStatus(loginStatus, error.message, true);
      }
    }

    function renderCart() {
      cartList.innerHTML = '';
      let total = 0;
      cart.forEach((entry, productId) => {
        const lineTotal = Number(entry.product.preco) * entry.quantity;
        total += lineTotal;
        const li = document.createElement('li');
        li.className = 'cart-row';
        const title = document.createElement('span');
        title.textContent = `${entry.product.nome} · R$ ${Number(entry.product.preco).toFixed(2)}`;
        const quantity = document.createElement('input');
        quantity.type = 'number';
        quantity.min = '1';
        quantity.max = String(entry.product.quantidade);
        quantity.value = String(entry.quantity);
        quantity.setAttribute('aria-label', `Quantidade de ${entry.product.nome}`);
        quantity.addEventListener('change', () => {
          const nextQuantity = Number(quantity.value);
          if (!Number.isInteger(nextQuantity) || nextQuantity < 1 || nextQuantity > entry.product.quantidade) {
            quantity.value = String(entry.quantity);
            setStatus(saleStatus, `Estoque de ${entry.product.nome}: ${entry.product.quantidade} unidade(s).`, true);
            return;
          }
          entry.quantity = nextQuantity;
          setStatus(saleStatus, '');
          renderCart();
        });
        const subtotal = document.createElement('strong');
        subtotal.textContent = `R$ ${lineTotal.toFixed(2)}`;
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.textContent = 'Remover';
        remove.setAttribute('aria-label', `Remover ${entry.product.nome} do carrinho`);
        remove.addEventListener('click', () => {
          cart.delete(productId);
          renderCart();
        });
        li.append(title, quantity, subtotal, remove);
        cartList.appendChild(li);
      });
      if (!cart.size) {
        cartList.innerHTML = '<li><span>Nenhum produto no carrinho.</span></li>';
      }
      cartTotal.innerHTML = `<strong>Total: R$ ${total.toFixed(2)}</strong>`;
    }

    function addToCart(product) {
      if (Number(product.quantidade) < 1) {
        setStatus(saleStatus, `${product.nome} está sem estoque.`, true);
        return;
      }
      const existing = cart.get(product.id);
      if (existing && existing.quantity >= Number(product.quantidade)) {
        setStatus(saleStatus, `Estoque máximo de ${product.nome}: ${product.quantidade} unidade(s).`, true);
        return;
      }
      cart.set(product.id, {
        product,
        quantity: existing ? existing.quantity + 1 : 1,
      });
      setStatus(saleStatus, '');
      renderCart();
    }

    async function loadCustomers() {
      try {
        const customers = await apiFetch('/customers');
        const selectedId = saleCustomer.value;
        saleCustomer.innerHTML = '<option value="">Consumidor final</option>';
        customers.forEach((customer) => {
          const option = document.createElement('option');
          option.value = String(customer.id);
          option.textContent = customer.telefone ? `${customer.nome} · ${customer.telefone}` : customer.nome;
          saleCustomer.appendChild(option);
        });
        if (customers.some((customer) => String(customer.id) === selectedId)) {
          saleCustomer.value = selectedId;
        }
      } catch (error) {
        setStatus(customerStatus, error.message, true);
      }
    }

    async function loadProducts(query = '') {
      try {
        const data = await apiFetch(`/products?q=${encodeURIComponent(query)}`);
        productsList.innerHTML = '';
        if (!data.length) {
          productsList.innerHTML = '<li><span>Nenhum produto encontrado.</span></li>';
          return;
        }

        data.forEach((item) => {
          const li = document.createElement('li');
          const left = document.createElement('span');
          left.textContent = `${item.nome} · ${item.quantidade} und. · R$ ${Number(item.preco).toFixed(2)}`;
          const add = document.createElement('button');
          add.type = 'button';
          add.textContent = Number(item.quantidade) > 0 ? 'Adicionar' : 'Sem estoque';
          add.disabled = Number(item.quantidade) < 1;
          add.addEventListener('click', () => addToCart(item));
          li.append(left, add);
          productsList.appendChild(li);
        });
      } catch (error) {
        setStatus(loginStatus, error.message, true);
        setScreen('login');
      }
    }

    async function registerSale() {
      if (!cart.size) {
        setStatus(saleStatus, 'Adicione pelo menos um produto ao carrinho.', true);
        return;
      }

      try {
        const items = Array.from(cart, ([produto_id, entry]) => ({ produto_id, quantidade: entry.quantity }));
        const clienteId = saleCustomer.value ? Number(saleCustomer.value) : null;
        const response = await apiFetch('/sales', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itens: items, cliente_id: clienteId })
        });

        setStatus(saleStatus, `Venda #${response.id} para ${response.cliente_nome}: R$ ${Number(response.valor_total).toFixed(2)}.`, false);
        cart.clear();
        renderCart();
      } catch (error) {
        setStatus(saleStatus, error.message, true);
      }
    }

    async function createCustomer() {
      const nome = customerNameInput.value.trim();
      const telefone = customerPhoneInput.value.trim();
      if (!nome) {
        setStatus(customerStatus, 'Informe o nome do cliente.', true);
        return;
      }
      try {
        const customer = await apiFetch('/customers', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, telefone }),
        });
        await loadCustomers();
        saleCustomer.value = String(customer.id);
        customerNameInput.value = '';
        customerPhoneInput.value = '';
        setStatus(customerStatus, 'Cliente cadastrado e selecionado.', false);
      } catch (error) {
        setStatus(customerStatus, error.message, true);
      }
    }

    async function createProduct() {
      const nome = productNameInput.value.trim();
      const marca = productBrandInput.value.trim();
      const numeroFabrica = productFactoryNumberInput.value.trim();
      const categoria = productCategoryInput.value.trim();
      const quantidade = Number(productQuantityInput.value);
      const precoCusto = Number(productCostPriceInput.value);
      const preco = Number(productPriceInput.value);

      if (!nome || !marca || !numeroFabrica || !categoria) {
        setStatus(productStatus, 'Preencha nome, marca, número de fábrica e categoria.', true);
        return;
      }
      if (!Number.isFinite(quantidade) || quantidade < 0) {
        setStatus(productStatus, 'Quantidade inválida.', true);
        return;
      }
      if (!Number.isFinite(precoCusto) || precoCusto < 0) {
        setStatus(productStatus, 'Preço de custo inválido.', true);
        return;
      }
      if (!Number.isFinite(preco) || preco < 0) {
        setStatus(productStatus, 'Preço de venda inválido.', true);
        return;
      }

      try {
        await apiFetch('/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome,
            marca,
            numero_fabrica: numeroFabrica,
            categoria,
            quantidade,
            preco_custo: precoCusto,
            preco,
          })
        });

        setStatus(productStatus, 'Produto cadastrado com sucesso.', false);
        productNameInput.value = '';
        productBrandInput.value = '';
        productFactoryNumberInput.value = '';
        productCategoryInput.value = '';
        productQuantityInput.value = '0';
        productCostPriceInput.value = '0';
        productPriceInput.value = '0';
      } catch (error) {
        setStatus(productStatus, error.message, true);
      }
    }

    async function loadFinancialReport() {
      try {
        const params = new URLSearchParams();
        if (financeStart.value) params.set('data_inicio', financeStart.value);
        if (financeEnd.value) params.set('data_fim', financeEnd.value);
        const response = await apiFetch(`/reports/sales?${params.toString()}`);

        financeSummary.innerHTML = `
          <strong>Vendas:</strong> ${response.quantidade_vendas} | 
          <strong>Unidades:</strong> ${response.unidades_vendidas} | 
          <strong>Valor:</strong> R$ ${response.valor_total.toFixed(2)}
        `;
        financeList.innerHTML = '';

        if (!response.vendas.length) {
          financeList.innerHTML = '<li><span>Nenhuma venda no período.</span></li>';
          return;
        }

        response.vendas.forEach((item) => {
          const li = document.createElement('li');
          const left = document.createElement('span');
          const right = document.createElement('strong');
          left.textContent = `${item.nome} · ${item.quantidade} und.`;
          right.textContent = `R$ ${Number(item.valor_total).toFixed(2)}`;
          li.appendChild(left);
          li.appendChild(right);
          financeList.appendChild(li);
        });
      } catch (error) {
        financeSummary.textContent = error.message;
        financeSummary.style.color = '#fca5a5';
      }
    }

    navVendas.addEventListener('click', () => setScreen('vendas'));
    navProdutos.addEventListener('click', () => {
      if (currentUser && currentUser.role === 'admin') setScreen('produtos');
    });
    navFinanceiro.addEventListener('click', () => {
      if (currentUser && currentUser.role === 'admin') {
        setScreen('financeiro');
        loadFinancialReport();
      }
    });
    navVendasAlt.addEventListener('click', () => setScreen('vendas'));
    navVendasProducts.addEventListener('click', () => setScreen('vendas'));
    navProdutosProducts.addEventListener('click', () => {
      if (currentUser && currentUser.role === 'admin') setScreen('produtos');
    });
    navFinanceiroProducts.addEventListener('click', () => {
      if (currentUser && currentUser.role === 'admin') {
        setScreen('financeiro');
        loadFinancialReport();
      }
    });
    navProdutosFinance.addEventListener('click', () => {
      if (currentUser && currentUser.role === 'admin') setScreen('produtos');
    });
    navFinanceiroAlt.addEventListener('click', () => {
      if (currentUser && currentUser.role === 'admin') {
        setScreen('financeiro');
        loadFinancialReport();
      }
    });

    document.getElementById('login-button').addEventListener('click', login);
    document.getElementById('search-button').addEventListener('click', () => {
      loadProducts(productSearch.value.trim());
    });
    document.getElementById('sale-button').addEventListener('click', registerSale);
    document.getElementById('create-customer-button').addEventListener('click', createCustomer);
    document.getElementById('create-product-button').addEventListener('click', createProduct);
    document.getElementById('finance-button').addEventListener('click', loadFinancialReport);
    document.getElementById('logout-button').addEventListener('click', () => {
      clearToken();
      cart.clear();
      renderCart();
      setStatus(loginStatus, '');
      setStatus(saleStatus, '');
      setScreen('login');
    });
    document.getElementById('logout-button-finance').addEventListener('click', () => {
      clearToken();
      cart.clear();
      renderCart();
      setStatus(loginStatus, '');
      setStatus(saleStatus, '');
      setScreen('login');
    });
    document.getElementById('logout-button-products').addEventListener('click', () => {
      clearToken();
      cart.clear();
      renderCart();
      setStatus(loginStatus, '');
      setStatus(saleStatus, '');
      setScreen('login');
    });
    document.getElementById('password').addEventListener('keydown', (event) => {
      if (event.key === 'Enter') login();
    });
    appNav.classList.add('hidden');
    appNavProducts.classList.add('hidden');
    appNavFinance.classList.add('hidden');

    if (getToken()) {
      apiFetch('/auth/me')
        .then((user) => {
          currentUser = user;
          updateNavigation();
          setScreen('vendas');
          productsList.innerHTML = '<li><span>Use a pesquisa para carregar produtos.</span></li>';
          loadCustomers();
        })
        .catch(() => {
          clearToken();
          setScreen('login');
        });
    } else {
      renderCart();
      setScreen('login');
    }
  </script>
</body>
</html>
